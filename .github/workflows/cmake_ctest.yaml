name: Build and test

on:
    push:
        branches: [ "master", "dev", "oncvpsp-opt" ]
    pull_request:
        branches: [ "master", "oncvpsp-opt" ]

jobs:
    all:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install dependencies
              run: |
                sudo apt update
                sudo apt install -y build-essential gfortran liblapack-dev libxc-dev
            # the presets of the developers (CMakePresets.json): the default test
            # preset leaves out the smoothness scans (label scan)
            - name: Build
              run: |
                cmake --preset default
                cmake --build --preset default --parallel
            - name: Test
              run: ctest --preset default -j "$(nproc)"
    # without the optional parts: the fully-relativistic executables, Libxc and
    # TOML, whose tests must then be left out or disabled
    minimal:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Install dependencies
              run: |
                sudo apt update
                sudo apt install -y build-essential gfortran liblapack-dev
            - name: Build
              run: |
                cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DONCVPSP_WITH_FR=OFF \
                  -DONCVPSP_WITH_Libxc=OFF -DONCVPSP_WITH_TOML=OFF
                cmake --build build --parallel
            - name: Test
              run: ctest --test-dir build -LE "scan|nist" -j "$(nproc)" --output-on-failure
