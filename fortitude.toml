# fortitude settings (https://fortitude.readthedocs.io), run by pre-commit.
# See doc/coding_standards.md.
[check]
# the preview rules too, for the two below (S291 is a preview default)
preview = true
# also: literals with a kind (no-real-suffix), and implicit none on the module
# only (superfluous-implicit-none)
extend-select = ["C021", "S201"]
# fortitude's default rules, except those that conflict with the coding
# standards
ignore = [
    "S271",  # unsorted-uses: use statements are in the order the code needs them
    "S241",  # bad-quote-string: strings are quoted with '
    # implicit-external-procedures: implicit none (type, external) is Fortran
    # 2018; gfortran's -Werror=implicit-interface makes the same check
    # (cmake/OncvpspCompilerOptions.cmake)
    "C003",
]
# the LAPACK interfaces declare their arrays as LAPACK does, assumed-size
per-file-ignores = { "src/lapack_m.f90" = ["C071"] }
# the legacy files keep to 80 columns
line-length = 80
# imported code, kept as written upstream
extend-exclude = [
    "src/exc_off_pbe_m.f",
    "src/functionals.F90",
    "src/m_libxc_list.F90",
    "tests/unit/gg1cc.f90",
    "tests/unit/gp1cc.f90",
    "tests/unit/gpp1cc.f90",
]
# apply the exclusions to files named on the command line (by pre-commit)
force-exclude = true
